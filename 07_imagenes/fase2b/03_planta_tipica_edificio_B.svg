ujo no acredita distancia.</text><line x1="32" y1="915" x2="1568" y2="915" stroke="#687481" stroke-width="2" fill="none"/><text x="42" y="944" font-size="17" font-weight="bold" text-anchor="start" fill="#183153">CLASIFICACIÓN: datos oficiales + supuestos de diseño rotulados + resultados calculados.</text><text x="42" y="970" font-size="16" font-weight="normal" text-anchor="start" fill="#687481">No es plano a escala ni constructivo. Revisión humana obligatoria. Generado con apoyo visual de OpenAI Codex, 2026-10-25.</text></svg>