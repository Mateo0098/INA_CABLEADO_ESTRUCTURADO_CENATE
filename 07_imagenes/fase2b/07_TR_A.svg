ke-width="8" fill="none" marker-end="url(#arrow)"/><rect x="1050" y="570" width="480" height="190" rx="8" fill="#fff2b8" stroke="#e57c23" stroke-width="4"/><text x="1080" y="615" font-size="18" font-weight="bold" text-anchor="start" fill="#183153">PATCH CORDS</text><text x="1080" y="649" font-size="18" font-weight="bold" text-anchor="start" fill="#183153">Cobre: cantidad base = 160 en rack + 160 en usuario</text><text x="1080" y="683" font-size="18" font-weight="bold" text-anchor="start" fill="#183153">Fibra: cantidad depende de pares activos (pendiente)</text><text x="1080" y="717" font-size="18" font-weight="bold" text-anchor="start" fill="#183153">No se infiere un switch por cada posición pasiva.</text><text x="90" y="560" font-size="21" font-weight="bold" text-anchor="start" fill="#183153">Canalización hacia áreas</text><line x1="95" y1="600" x2="515" y2="600" stroke="#e57c23" stroke-width="14" fill="none"/><text x="100" y="650" font-size="18" font-weight="normal" text-anchor="start" fill="#183153">Bandeja de pasillo + derivaciones</text><text x="100" y="682" font-size="18" font-weight="normal" text-anchor="start" fill="#183153">Dimensión: pendiente de diámetro real</text><text x="100" y="714" font-size="18" font-weight="normal" text-anchor="start" fill="#183153">y cálculo de ocupación.</text><line x1="32" y1="915" x2="1568" y2="915" stroke="#687481" stroke-width="2" fill="none"/><text x="42" y="944" font-size="17" font-weight="bold" text-anchor="start" fill="#183153">CLASIFICACIÓN: datos oficiales + supuestos de diseño rotulados + resultados calculados.</text><text x="42" y="970" font-size="16" font-weight="normal" text-anchor="start" fill="#687481">No es plano a escala ni constructivo. Revisión humana obligatoria. Generado con apoyo visual de OpenAI Codex, 2026-10-25.</text></svg>