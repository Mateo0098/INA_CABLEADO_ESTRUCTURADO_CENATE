<text x="98" y="710" font-size="20" font-weight="700" text-anchor="start" fill="#202D3A">LONGITUDES DE ESCENARIO — NO SON MEDICIONES</text>
<text x="105" y="735" font-size="18" font-weight="400" text-anchor="start" fill="#202D3A">E1 cable: 221,55 m = (145 + 50 + 16) × 1,05</text>
<text x="105" y="769" font-size="18" font-weight="400" text-anchor="start" fill="#202D3A">E2 cable: 247,80 m = (145 + 75 + 16) × 1,05</text>
<text x="105" y="803" font-size="18" font-weight="400" text-anchor="start" fill="#202D3A">E3 cable: 69,30 m = (50 + 16) × 1,05</text>
<text x="105" y="837" font-size="18" font-weight="400" text-anchor="start" fill="#202D3A">145 m reportados; 50 m propuestos; x=75 m e y=50 m supuestos.</text>
<text x="105" y="871" font-size="18" font-weight="400" text-anchor="start" fill="#202D3A">Ducto común 145 m + extensión a A 50 m: condición por validar.</text>
<text x="105" y="905" font-size="18" font-weight="400" text-anchor="start" fill="#202D3A">Los 16 m cubren entradas y reservas del escenario; 5 % desperdicio.</text>
